[project]
name = "Pomlet"
version = "0.0.3"
description = "A simple Pomodoro timer for your studies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "dropbox>=12.0.2",
    "pillow>=11.1.0",
    "pyqtdarktheme>=2.1.0",
    "pyside6>=6.9.1",
]

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "nuitka>=2.7.6",
    "pyinstaller>=6.12.0",
]

[build-system]
requires = ["setuptools>=42", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
